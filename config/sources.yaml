# Config-driven Job Source Connectors Configuration
sources:
  - id: "remoteok"
    name: "RemoteOK API"
    enabled: true
    type: "api"
    url: "https://remoteok.com/api"
    categories: ["internship", "dev", "python", "java", "backend", "ml"]

  - id: "internshala"
    name: "Internshala Scraper"
    enabled: true
    type: "scraper"
    base_url: "https://internshala.com"
    search_keywords:
      - "software-development"
      - "java-development"
      - "artificial-intelligence-ai"
      - "machine-learning"
      - "full-stack-development"

  - id: "company_careers"
    name: "Target Company Careers Feeds"
    enabled: true
    type: "careers_feed"
    companies:
      - name: "Google"
        careers_url: "https://www.google.com/about/careers/applications/jobs/results/?q=software%20engineer%20intern"
      - name: "Microsoft"
        careers_url: "https://careers.microsoft.com/v2/global/en/search?q=intern"
      - name: "PayPal"
        careers_url: "https://paypal.eightfold.ai/careers?query=intern"
      - name: "CRED"
        careers_url: "https://cred.club/careers"

  - id: "web_search"
    name: "Broad Web ATS Search"
    enabled: true
    type: "web_search"
    platforms: ["Greenhouse", "Lever", "Workday", "SmartRecruiters"]

  - id: "linkedin"
    name: "LinkedIn Public Job Search"
    enabled: true
    type: "scraper"
    search_keywords:
      - "Software Engineer Intern"
      - "AI ML Intern"
      - "Backend Developer Intern Java"
